- insert:
    - id: dsh-user-files
      name: '@dsh-external/dsh-user-files'
      config:
        enabled: false
        maxResolveBatchSize: 128
        maxTextReadBytes: 1048576
        maxUploadBytes: 10737418240
        maxByteReadBytes: 16777216
        openMode: preview
        batchDelayMs: 10
        maxBatchSize: 128
        cacheTtlMs: 5000
        maxCacheEntries: 2048
        maxPendingPaths: 4096
        maxCandidatesPerText: 256
